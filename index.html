<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi página web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3e8ff;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #6a0dad;
            color: white;
            padding: 30px;
        }

        h1 {
            font-size: 40px;
            margin: 0;
        }

        .contenido {
            background-color: white;
            width: 70%;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #999;
        }

        button {
            background-color: #6a0dad;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #4b087c;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Mi página web</h1>
        <p>Bienvenidos a mi sitio</p>
    </header>

    <div class="contenido">
        <h2>Sobre nosotros</h2>
        <p>
            Esta es una página web creada con HTML y CSS.
        </p>

        <button>Conocer más</button>
    </div>

    <footer>
        <p>© 2026 Mi página web</p>
    </footer>

</body>
</html>
